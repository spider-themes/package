name: Package WordPress Plugin
description: Build, zip, and deploy a WordPress plugin to Google Drive (branches) or GitHub Releases (tags).

inputs:
  slug:
    description: "Plugin/theme slug — used as the directory name and ZIP prefix"
    required: true
  prod_files:
    description: "Space-separated list of files/dirs to include in the ZIP"
    required: true
  node_version:
    description: "Node.js version"
    required: false
    default: "24"
  php_version:
    description: "PHP version"
    required: false
    default: "8.4"
  gdrive_token:
    description: "Google Drive OAuth token for rclone (pass via org secret)"
    required: false
  svn_username:
    description: "WordPress.org SVN username (pass via org secret)"
    required: false
  svn_password:
    description: "WordPress.org SVN password (pass via org secret)"
    required: false
  vps_host:
    description: "VPS hostname or IP for changelog upload (pass via org secret)"
    required: false
  vps_user:
    description: "VPS SSH username (pass via org secret)"
    required: false
  vps_ssh_key:
    description: "VPS SSH private key (pass via org secret)"
    required: false
  vps_port:
    description: "VPS SSH port (pass via org secret)"
    required: false
    default: "22"
  changelogs_path:
    description: "Destination path on VPS for changelogs"
    required: false
    default: "~/public_html/global-changelogs/"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        tools: wp-cli

    - name: NPM Build
      shell: bash
      run: |
        if [ -f package.json ]; then
          if grep -q '"build"' package.json; then
            if grep -qE '"dependencies":\s*\{|"devDependencies":\s*\{' package.json; then
              npm ci
            fi
            npm run build
          else
            echo "No 'build' script in package.json, skipping npm build"
          fi
        elif [ -f scripts/build.js ]; then
          node scripts/build.js
        else
          echo "No package.json or scripts/build.js found, skipping build"
        fi

    - name: Composer Install (Production)
      shell: bash
      run: |
        if [ -f composer.json ]; then
          composer install --no-dev --optimize-autoloader --no-interaction && composer dump-autoload
        else
          echo "No composer.json found, skipping"
        fi

    - name: Generate Localization (.pot)
      shell: bash
      run: |
        echo "Generating translation files for ${{ inputs.slug }}..."
        mkdir -p languages
        
        wp i18n make-pot . languages/${{ inputs.slug }}.pot \
          --slug="${{ inputs.slug }}" \
          --domain="${{ inputs.slug }}" \
          --exclude="node_modules,vendor,.github,tests"

    - name: Define Variables
      shell: bash
      run: |
        GDRIVE_TARGET_PATH="github/artifacts/${{ inputs.slug }}"
        REF="${{ github.sha }}"
        REF="${REF:0:7}"

        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          REF="${{ github.ref_name }}"
        fi

        SLUG="${{ inputs.slug }}-$REF"
        ZIP_FILE="$SLUG.zip"

        echo "DIR_NAME=${{ inputs.slug }}" >> $GITHUB_ENV
        echo "SLUG=$SLUG" >> $GITHUB_ENV
        echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
        echo "GDRIVE_TARGET_PATH=$GDRIVE_TARGET_PATH" >> $GITHUB_ENV

    - name: Production Directory
      shell: bash
      run: |
        mkdir -p "$DIR_NAME"
        for file in ${{ inputs.prod_files }}; do
          if [ -e "$file" ]; then
            cp -r "$file" "$DIR_NAME/"
          else
            echo "Skipping optional file: $file"
          fi
        done
        
        if [ -d "languages" ]; then
          cp -r languages "$DIR_NAME/"
        fi

    - name: Create ZIP
      shell: bash
      run: zip -r "$ZIP_FILE" "$DIR_NAME/"

    - name: Upload to Google Drive
      if: startsWith(github.ref, 'refs/heads/')
      shell: bash
      env:
        GDRIVE_TOKEN: ${{ inputs.gdrive_token }}
      run: |
        curl https://rclone.org/install.sh | sudo bash

        mkdir -p ~/.config/rclone
        cat > ~/.config/rclone/rclone.conf << EOF
        [gdrive]
        type = drive
        scope = drive
        token = $GDRIVE_TOKEN
        EOF

        echo "Uploading $ZIP_FILE to Google Drive: $GDRIVE_TARGET_PATH"
        rclone copy "$ZIP_FILE" "gdrive:$GDRIVE_TARGET_PATH" -v --drive-use-trash=false

        FILE_ID=$(rclone lsjson "gdrive:$GDRIVE_TARGET_PATH" | jq -r ".[] | select(.Name==\"$ZIP_FILE\") | .ID")

        if [ -n "$FILE_ID" ]; then
          DOWNLOAD_LINK="https://drive.google.com/uc?export=download&id=$FILE_ID"
          VIEW_LINK="https://drive.google.com/file/d/$FILE_ID/view"

          echo "## Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Plugin ZIP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** \`$ZIP_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Download ZIP]($DOWNLOAD_LINK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View in Google Drive]($VIEW_LINK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Path:** \`$GDRIVE_TARGET_PATH\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "Upload complete but could not retrieve file ID"
        fi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_FILE }}

    - name: Deploy to WordPress.org SVN
      if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && inputs.svn_username != ''
      uses: 10up/action-wordpress-plugin-deploy@stable
      env:
        SVN_USERNAME: ${{ inputs.svn_username }}
        SVN_PASSWORD: ${{ inputs.svn_password }}
        SLUG: ${{ inputs.slug }}
        BUILD_DIR: ${{ inputs.slug }}
        ASSETS_DIR: ./svn/assets
      with:
        generate-zip: false

    - name: Upload Changelog to VPS
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        VPS_HOST: ${{ inputs.vps_host }}
        VPS_PORT: ${{ inputs.vps_port }}
        VPS_USER: ${{ inputs.vps_user }}
        VPS_SSH_KEY: ${{ inputs.vps_ssh_key }}
        CHANGELOGS_PATH: ${{ inputs.changelogs_path }}
      run: |
        if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
          echo "VPS credentials not configured, skipping changelog upload"
          exit 0
        fi

        if [ ! -f changelog.txt ]; then
          echo "changelog.txt not found, skipping VPS upload"
          exit 0
        fi

        mkdir -p ~/.ssh
        echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
        chmod 600 ~/.ssh/vps_key
        ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

        scp -i ~/.ssh/vps_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
          changelog.txt \
          "$VPS_USER@$VPS_HOST:$CHANGELOGS_PATH/$SLUG-changelog.txt"

        echo "Uploaded changelog as \`$SLUG-changelog.txt\` to \`$VPS_HOST:$CHANGELOGS_PATH\`" >> $GITHUB_STEP_SUMMARY
